<!DOCTYPE html>
<html>
<head>
<title>Vehicle Recon</title>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; }
  input[type=file] { margin: 20px 0; padding: 10px; background: #334155; border-radius: 6px; width: 60%; }
  button { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #475569; }
  .spinner { border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
  .card { background: #0f172a; padding: 15px; border-radius: 8px; flex: 1; min-width: 250px; }
  img { max-width: 100%; border-radius: 6px; }
  #res-container { display: none; }
</style>
</head>
<body>
<div class="container">
  <h2>Unified Vehicle Reconstruction</h2>
  <input type='file' id='img' accept="image/*"><br>
  <button id="processBtn" onclick='run()'>Analyze & Reconstruct</button>
  <div id="loader" class="spinner"></div>
  
  <div id="res-container">
    <p>Confidence: <span id='conf'></span></p>
    <div class="grid">
      <div class="card">
        <h3>1. Target Detection</h3>
        <img id='original-img'>
      </div>
      <div class="card">
        <h3>2. Defect Injection</h3>
        <img id='damaged-img'>
      </div>
      <div class="card">
        <h3>3. GAN Recovery</h3>
        <img id='reconstructed-img'>
      </div>
    </div>
  </div>
</div>

<script>
  async function run() {
    const file = document.getElementById('img').files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => document.getElementById('original-img').src = e.target.result;
    reader.readAsDataURL(file);

    const btn = document.getElementById('processBtn');
    const loader = document.getElementById('loader');
    const res = document.getElementById('res-container');
    
    btn.disabled = true; loader.style.display = 'block'; res.style.display = 'none';
    const fd = new FormData(); fd.append('file', file);
    
    try {
      const r = await fetch('https://vehicle-recon-api-1.onrender.com/reconstruct', {method:'POST', body:fd});
      const d = await r.json();
      
      if (d.status === "success") {
        document.getElementById('conf').innerText = (d.confidence * 100).toFixed(1) + '%';
        document.getElementById('damaged-img').src = 'data:image/jpeg;base64,' + d.damaged_image_base64;
        document.getElementById('reconstructed-img').src = 'data:image/jpeg;base64,' + d.reconstructed_image_base64;
        res.style.display = 'block';
      }
    } finally {
      btn.disabled = false; loader.style.display = 'none';
    }
  }
</script>
</body>
</html>
