<!DOCTYPE html><html><head><title>Vehicle Recon</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:50px;}img{max-width:100%;border-radius:8px;margin-top:20px;}</style></head><body><h2>Vehicle Reconstruction</h2><input type='file' id='img'><button onclick='run()'>Process</button><div id='res' style='display:none'><p>Confidence: <span id='conf'></span></p><img id='out'></div><script>async function run(){const fd=new FormData();fd.append('file',document.getElementById('img').files[0]);const r=await fetch('https://vehicle-recon-api-1.onrender.com/reconstruct',{method:'POST',body:fd});const d=await r.json();document.getElementById('conf').innerText=d.confidence;document.getElementById('out').src='data:image/jpeg;base64,'+d.reconstructed_image_base64;document.getElementById('res').style.display='block';}</script></body></html>
