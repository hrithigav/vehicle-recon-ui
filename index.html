<!DOCTYPE html>
<html>
<head>
<title>Vehicle Recon</title>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  input[type=file] { margin: 20px 0; padding: 10px; background: #334155; border-radius: 6px; width: 80%; }
  button { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .spinner { border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
  .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; flex: 1; min-width: 250px; }
  .card h3 { margin-top: 0; color: #94a3b8; font-size: 16px; }
  img { max-width: 100%; border-radius: 6px; }
  .conf-tag { background: #166534; color: #4ade80; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; margin: 15px 0; display: inline-block; }
  #res-container { display: none; }
</style>
</head>
<body>
<div class="container">
  <h2 style="color: #38bdf8; margin-top:0;">Vehicle Reconstruction</h2>
  <input type='file' id='img' accept="image/*"><br>
  <button id="processBtn" onclick='run()'>Execute Inference</button>
  <div style="color: #64748b; font-size: 12px; margin-top: 12px;">Cold start: ~50s | Warm execution: ~2s</div>
  
  <div id="loader" class="spinner"></div>
  
  <div id="res-container">
    <div class="conf-tag">YOLOv8 Confidence: <span id='conf'></span></div>
    <div class="grid">
      <div class="card">
        <h3>Original Input</h3>
        <img id='before-img'>
      </div>
      <div class="card">
        <h3>GAN Reconstruction</h3>
        <img id='after-img'>
      </div>
    </div>
  </div>
</div>

<script>
  async function run() {
    const file = document.getElementById('img').files[0];
    if (!file) return;
    
    // 1. Instantly render the local "Before" image via FileReader
    const reader = new FileReader();
    reader.onload = (e) => document.getElementById('before-img').src = e.target.result;
    reader.readAsDataURL(file);

    const btn = document.getElementById('processBtn');
    const loader = document.getElementById('loader');
    const res = document.getElementById('res-container');
    
    btn.disabled = true; btn.innerText = 'Extracting Features...';
    loader.style.display = 'block'; res.style.display = 'none';
    
    const fd = new FormData(); fd.append('file', file);
    
    try {
      const r = await fetch('https://vehicle-recon-api-1.onrender.com/reconstruct', {method:'POST', body:fd});
      const d = await r.json();
      
      if (d.status === "success") {
        document.getElementById('conf').innerText = (d.confidence * 100).toFixed(2) + '%';
        document.getElementById('after-img').src = 'data:image/jpeg;base64,' + d.reconstructed_image_base64;
        res.style.display = 'block';
      } else {
        alert("Inference Error: " + (d.detail || 'Unknown'));
      }
    } catch (e) {
      alert('API connection failed. Waiting for Render instance to spin up.');
    } finally {
      btn.disabled = false; btn.innerText = 'Execute Inference';
      loader.style.display = 'none';
    }
  }
</script>
</body>
</html>
